<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FX Terminal">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://flagcdn.com">
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
  <title>FX Terminal Pro</title>
  <style>
    :root { --bg-color:#fff; --terminal-bg:#fff; --primary:#1b1f23; --accent:#0366d6; --warn:#a97800; --error:#d73a49; --text-gray:#586069; --border:#e8e8e8; }
    * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
    body { min-width:320px; overflow-x:hidden; background:var(--bg-color); color:var(--primary); font-family:"Fira Code","SF Mono",ui-monospace,monospace; }
    button, select, input { font:inherit; }
    button:focus-visible, select:focus-visible, input:focus-visible { outline:3px solid rgba(3,102,214,.35); outline-offset:2px; }
    .terminal-window { display:flex; flex-direction:column; min-height:100vh; width:100%; background:var(--terminal-bg); }
    .terminal-header { position:sticky; top:0; z-index:100; display:flex; align-items:center; gap:12px; padding:10px 16px; background:#f6f6f6; border-bottom:1px solid var(--border); }
    .terminal-buttons { display:flex; flex:0 0 auto; gap:8px; }
    .terminal-btn { width:12px; height:12px; border-radius:50%; }
    .btn-red { background:var(--error); } .btn-yellow { background:#ffbd2e; } .btn-green { background:#27c93f; }
    .terminal-title { flex:1; min-width:0; margin:0; overflow:hidden; color:var(--text-gray); font-size:13px; font-weight:600; letter-spacing:.04em; text-overflow:ellipsis; white-space:nowrap; }
    .header-toolbar { position:relative; display:flex; flex:0 0 auto; align-items:center; gap:6px; }
    .icon-btn { display:inline-grid; width:34px; height:34px; place-items:center; padding:0; border:1px solid transparent; border-radius:7px; background:transparent; color:var(--primary); cursor:pointer; }
    .icon-btn:hover:not(:disabled), .icon-btn[aria-expanded="true"] { border-color:var(--border); background:#fff; }
    .icon-btn.editing { border-color:var(--error); background:var(--error); color:#fff; }
    .icon-btn:disabled { opacity:.5; cursor:wait; }
    .icon-btn svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-linecap:round; stroke-linejoin:round; stroke-width:1.8; }
    .source-control { position:relative; }
    .source-menu { position:absolute; top:calc(100% + 7px); right:0; z-index:120; display:none; min-width:190px; padding:6px; border:1px solid var(--border); border-radius:9px; background:#fff; box-shadow:0 10px 26px rgba(0,0,0,.14); }
    .source-menu.active { display:block; }
    .source-option { display:flex; width:100%; align-items:center; gap:9px; padding:9px 10px; border:0; border-radius:6px; background:transparent; color:var(--primary); cursor:pointer; font-size:11px; text-align:left; }
    .source-option:hover, .source-option[aria-current="true"] { background:#eef4fc; color:var(--accent); }
    .source-option svg { flex:0 0 auto; width:16px; height:16px; fill:none; stroke:currentColor; stroke-linecap:round; stroke-linejoin:round; stroke-width:1.8; }
    .terminal-body { flex:1; }
    .header-content { padding:16px 16px 8px; }
    .update-time { min-height:16px; color:#777; font-size:11px; line-height:1.45; }
    .update-time.error { color:var(--error); } .update-time.cached { color:var(--warn); }
    .reference-note { margin-top:3px; color:#777; font-size:10px; line-height:1.45; }
    .btn { min-height:34px; padding:8px 12px; border:1px solid var(--primary); border-radius:4px; background:transparent; color:var(--primary); cursor:pointer; font-size:11px; font-weight:600; }
    .btn:hover:not(:disabled) { background:#f6f8fa; } .btn:disabled { opacity:.5; cursor:wait; }
    .btn.editing { border-color:var(--error); background:var(--error); color:#fff; }
    .currency-list-container { position:relative; display:flex; flex-direction:column; gap:6px; padding:0 12px 12px; }
    .currency-card { position:relative; display:flex; align-items:center; width:100%; height:44px; padding:0 12px; overflow:hidden; border:1px solid rgba(0,0,0,.08); border-radius:8px; transition:box-shadow .2s, transform .2s; user-select:none; -webkit-user-select:none; }
    .currency-card.dragging { z-index:50; opacity:.88; box-shadow:0 8px 20px rgba(0,0,0,.25); }
    .currency-card.editing { padding-left:108px; }
    .card-actions-left { position:absolute; left:8px; z-index:10; display:none; align-items:center; gap:5px; }
    .currency-card.editing .card-actions-left { display:flex; }
    .drag-handle { padding:4px; color:rgba(0,0,0,.58); cursor:grab; font-size:18px; line-height:1; touch-action:none; }
    .drag-handle:active { cursor:grabbing; }
    .delete-btn { display:flex; align-items:center; justify-content:center; width:20px; height:20px; border:0; border-radius:50%; background:var(--error); color:#fff; cursor:pointer; font-size:13px; font-weight:700; touch-action:none; }
    .pin-btn { display:grid; width:22px; height:22px; place-items:center; padding:0; border:1px solid rgba(0,0,0,.26); border-radius:50%; background:rgba(255,255,255,.35); color:rgba(0,0,0,.68); cursor:pointer; }
    .pin-btn svg { width:13px; height:13px; fill:transparent; stroke:currentColor; stroke-linecap:round; stroke-linejoin:round; stroke-width:1.8; }
    .pin-btn.pinned { border-color:#8a6700; background:#fff7c2; color:#8a6700; }
    .pin-btn.pinned svg { fill:#ffcc00; }
    .flag-icon { flex:0 0 auto; width:24px; height:24px; margin-right:10px; overflow:hidden; border:1px solid rgba(0,0,0,.15); border-radius:50%; }
    .flag-icon img { width:100%; height:100%; object-fit:cover; }
    .currency-info { display:flex; flex:1.2; align-items:center; min-width:0; gap:7px; overflow:hidden; }
    .currency-code { flex:0 0 auto; overflow:hidden; color:#000; font-size:16px; font-weight:700; line-height:1.15; text-overflow:ellipsis; white-space:nowrap; }
    .pin-indicator { flex:0 0 auto; color:#8a6700; font-size:12px; line-height:1; }
    .currency-name { min-width:0; overflow:hidden; color:rgba(0,0,0,.68); font-size:10px; font-weight:600; line-height:1.15; text-overflow:ellipsis; white-space:nowrap; }
    .currency-value { display:flex; flex:1.5; align-items:flex-end; padding-left:8px; }
    .amount-input { width:100%; border:0; outline:0; background:transparent; color:#000; cursor:pointer; font-size:17px; font-weight:700; text-align:right; }
    .modal { position:fixed; inset:0; z-index:1000; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.5); }
    .modal.active { display:flex; }
    .modal-content { display:flex; align-items:center; justify-content:center; width:100%; height:100%; }
    .calc-container { width:min(340px,calc(100% - 32px)); padding:24px; border:1px solid var(--border); border-radius:20px; background:#fff; box-shadow:0 10px 40px rgba(0,0,0,.15); }
    .calc-header { display:flex; flex-direction:column; justify-content:flex-end; height:80px; padding:16px; margin-bottom:20px; border:1px solid var(--border); border-radius:12px; background:#f6f6f6; text-align:right; }
    .calc-display { color:var(--warn); font-size:32px; font-weight:700; line-height:1.2; overflow:hidden; text-overflow:ellipsis; }
    .calc-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
    .calc-btn { height:60px; border:0; border-radius:12px; background:#f6f6f6; color:var(--primary); cursor:pointer; font-size:20px; }
    .calc-btn:active { transform:scale(.98); } .calc-btn.op { background:#eef4fc; color:var(--accent); } .calc-btn.done { grid-column:span 2; background:#2ea44f; color:#fff; }
    #add-modal .modal-content { align-items:stretch; background:#fff; }
    #add-modal .terminal-header { width:100%; }
    .currency-options { flex:1; overflow-y:auto; }
    .currency-option { display:flex; align-items:center; padding:12px 16px; border-bottom:1px solid var(--border); cursor:pointer; }
    .currency-option:hover { background:#f6f8fa; } .currency-option img { width:32px; height:32px; margin-right:12px; border:1px solid var(--border); border-radius:50%; }
    @media (max-width:440px) { .terminal-header { gap:8px; padding:9px 12px; } .terminal-buttons { gap:5px; } .terminal-btn { width:10px; height:10px; } .terminal-title { font-size:11px; } .header-toolbar { gap:2px; } .icon-btn { width:32px; height:32px; } .currency-card { height:46px; } .currency-name { font-size:9px; } }
  </style>
</head>
<body>
  <main class="terminal-window">
    <header class="terminal-header">
      <div class="terminal-buttons" aria-hidden="true"><span class="terminal-btn btn-red"></span><span class="terminal-btn btn-yellow"></span><span class="terminal-btn btn-green"></span></div>
      <h1 class="terminal-title">FX PRO TERMINAL</h1>
      <nav class="header-toolbar" aria-label="匯率工具列">
        <button class="icon-btn" id="refresh-btn" type="button" aria-label="重新整理匯率" title="重新整理匯率"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0 2 5.3"/><path d="M20 4v7h-7"/></svg></button>
        <button class="icon-btn" id="edit-btn" type="button" aria-label="編輯貨幣清單" title="編輯貨幣清單"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 20 4.2-1 10.6-10.6a2.1 2.1 0 0 0-3-3L5.2 16z"/><path d="m14.5 6.5 3 3"/></svg></button>
        <button class="icon-btn" id="add-btn" type="button" aria-label="新增貨幣" title="新增貨幣"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
        <button class="icon-btn" id="install-btn" type="button" aria-label="安裝應用程式" title="安裝應用程式" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg></button>
        <div class="source-control">
          <button class="icon-btn" id="source-menu-btn" type="button" aria-label="選擇匯率來源" aria-controls="source-menu" aria-expanded="false" title="選擇匯率來源"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16M4 12h16M4 19h16"/><circle cx="8" cy="5" r="1.5"/><circle cx="16" cy="12" r="1.5"/><circle cx="11" cy="19" r="1.5"/></svg></button>
          <div class="source-menu" id="source-menu" role="menu" aria-label="匯率來源">
            <button class="source-option" type="button" data-api-type="currencyapi" role="menuitem"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16v10H4z"/><path d="M8 11h.01M12 11h4M8 15h8"/></svg><span>Currency API</span></button>
            <button class="source-option" type="button" data-api-type="openerapi" role="menuitem"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg><span>Open ER API</span></button>
          </div>
        </div>
      </nav>
    </header>
    <section class="terminal-body" aria-label="匯率換算器">
      <div class="header-content">
        <div class="update-time" id="update-time" role="status" aria-live="polite">正在同步匯率資料…</div>
        <p class="reference-note">匯率僅供參考；實際銀行或換匯商報價可能不同。</p>
      </div>
      <div id="currency-list" class="currency-list-container" aria-live="polite"></div>
    </section>
  </main>
  <div class="modal" id="calc-modal" role="dialog" aria-modal="true" aria-labelledby="calc-title">
    <div class="modal-content"><div class="calc-container">
      <div id="calc-title" style="color:var(--primary);margin-bottom:10px;font-size:12px"></div>
      <div class="calc-header"><div id="calc-expr" style="color:#777;font-size:14px;min-height:1.2em"></div><div class="calc-display" id="calc-display">0</div></div>
      <div class="calc-grid">
        <button class="calc-btn" type="button" style="color:var(--error)" onclick="calcAction('AC')">AC</button><button class="calc-btn" type="button" style="color:var(--error)" onclick="calcAction('DEL')">⌫</button><button class="calc-btn op" type="button" onclick="calcInput('/')">÷</button><button class="calc-btn op" type="button" onclick="calcInput('*')">×</button>
        <button class="calc-btn" type="button" onclick="calcInput('7')">7</button><button class="calc-btn" type="button" onclick="calcInput('8')">8</button><button class="calc-btn" type="button" onclick="calcInput('9')">9</button><button class="calc-btn op" type="button" onclick="calcInput('-')">−</button>
        <button class="calc-btn" type="button" onclick="calcInput('4')">4</button><button class="calc-btn" type="button" onclick="calcInput('5')">5</button><button class="calc-btn" type="button" onclick="calcInput('6')">6</button><button class="calc-btn op" type="button" onclick="calcInput('+')">+</button>
        <button class="calc-btn" type="button" onclick="calcInput('1')">1</button><button class="calc-btn" type="button" onclick="calcInput('2')">2</button><button class="calc-btn" type="button" onclick="calcInput('3')">3</button><button class="calc-btn op" type="button" onclick="calcInput('.')">.</button>
        <button class="calc-btn" type="button" onclick="calcInput('0')">0</button><button class="calc-btn" type="button" onclick="calcInput('00')">00</button><button class="calc-btn done" type="button" onclick="calcAction('DONE')">確認</button>
      </div>
      <button class="btn" type="button" style="width:100%;margin-top:20px;padding:15px;border-color:var(--error);color:var(--error)" onclick="closeModal('calc-modal')">取消</button>
    </div></div>
  </div>
  <div class="modal" id="add-modal" role="dialog" aria-modal="true" aria-label="選擇貨幣">
    <div class="modal-content"><section style="display:flex;flex-direction:column;width:100%"><header class="terminal-header"><div class="terminal-title" style="margin-right:0;text-align:left">選擇貨幣</div><button class="btn" type="button" id="modal-close" style="border-color:var(--error);color:var(--error)">關閉</button></header><div id="currency-options" class="currency-options"></div></section></div>
  </div>
  <script src="./app.js"></script>
</body>
</html>
