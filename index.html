<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FX Terminal">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://flagcdn.com">
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
  <title>FX Terminal Pro</title>
  <script>try{const root=document.documentElement;const theme=localStorage.getItem('fx_terminal_theme');if(theme==='dark'||(!theme&&matchMedia('(prefers-color-scheme: dark)').matches))root.dataset.theme='dark';const density=localStorage.getItem('fx_terminal_density');root.dataset.density=density==='comfortable'?'comfortable':'compact';const cardTheme=localStorage.getItem('fx_terminal_card_theme');root.dataset.cardTheme=['pastel','soft','mono'].includes(cardTheme)?cardTheme:'pastel';}catch{}</script>
  <style>
    :root { --bg-color:#fff; --terminal-bg:#fff; --surface:#f6f6f6; --surface-hover:#fff; --surface-selected:#eef4fc; --primary:#1b1f23; --accent:#0366d6; --warn:#a97800; --error:#d73a49; --editing-bg:#d73a49; --editing-border:#d73a49; --text-gray:#586069; --text-muted:#666; --border:#e8e8e8; }
    html[data-theme="dark"] { color-scheme:dark; --bg-color:#111315; --terminal-bg:#111315; --surface:#1b1e21; --surface-hover:#282c30; --surface-selected:#30383f; --primary:#e6e9ec; --accent:#91a9bd; --warn:#b5a879; --error:#ef8fa1; --editing-bg:#f3b7c2; --editing-border:#ffd1d9; --toolbar-btn-bg:#c9e5f7; --toolbar-btn-hover:#e0f2ff; --toolbar-btn-border:#9ec9e5; --text-gray:#b9c0c6; --text-muted:#949da5; --border:#3a4147; }
    * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
    body { min-width:320px; overflow-x:hidden; background:var(--bg-color); color:var(--primary); font-family:"Fira Code","SF Mono",ui-monospace,monospace; }
    button, select, input { font:inherit; }
    button:focus-visible, select:focus-visible, input:focus-visible { outline:3px solid rgba(3,102,214,.35); outline-offset:2px; }
    .terminal-window { display:flex; flex-direction:column; min-height:100vh; width:100%; background:var(--terminal-bg); }
    .terminal-header { position:sticky; top:0; z-index:100; display:flex; align-items:center; gap:12px; padding:10px 16px; background:var(--surface); border-bottom:1px solid var(--border); }
    .terminal-buttons { display:flex; flex:0 0 auto; gap:8px; }
    .terminal-btn { width:12px; height:12px; border-radius:50%; }
    .btn-red { background:var(--error); } .btn-yellow { background:#ffbd2e; } .btn-green { background:#27c93f; }
    .terminal-title { flex:1; min-width:0; margin:0; overflow:hidden; color:var(--text-gray); font-size:13px; font-weight:600; letter-spacing:.04em; text-overflow:ellipsis; white-space:nowrap; }
    .header-toolbar { position:relative; display:flex; flex:0 0 auto; align-items:center; gap:6px; }
    .icon-btn { display:inline-grid; width:34px; height:34px; place-items:center; padding:0; overflow:hidden; border:1px solid transparent; border-radius:9px; background:transparent; color:var(--primary); cursor:pointer; }
    .icon-btn:hover:not(:disabled), .icon-btn[aria-expanded="true"] { border-color:var(--border); background:var(--surface-hover); }
    .icon-btn.editing { border-color:var(--editing-border); background:var(--editing-bg); color:#3a2028; }
    .icon-btn:disabled { opacity:.5; cursor:wait; }
    .icon-btn svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-linecap:round; stroke-linejoin:round; stroke-width:1.65; }
    .source-control, .preferences-control { position:relative; }
    .source-menu { position:absolute; top:calc(100% + 7px); right:0; z-index:120; display:none; min-width:190px; padding:6px; border:1px solid var(--border); border-radius:9px; background:var(--surface); box-shadow:0 10px 26px rgba(0,0,0,.24); }
    .source-menu.active { display:block; }
    .preferences-menu { position:absolute; top:calc(100% + 7px); right:0; z-index:120; display:none; width:min(258px,calc(100vw - 24px)); padding:12px; border:1px solid var(--border); border-radius:10px; background:var(--surface); box-shadow:0 10px 26px rgba(0,0,0,.24); }
    .preferences-menu.active { display:block; }
    .preferences-section + .preferences-section { padding-top:11px; margin-top:11px; border-top:1px solid var(--border); }
    .preferences-label { margin-bottom:8px; color:var(--text-muted); font-size:10px; font-weight:600; letter-spacing:.04em; }
    .choice-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px; }
    .choice-grid.color-themes { grid-template-columns:repeat(3,minmax(0,1fr)); }
    .preference-choice { display:flex; min-height:36px; align-items:center; justify-content:center; gap:5px; padding:6px; border:1px solid var(--border); border-radius:6px; background:transparent; color:var(--primary); cursor:pointer; font-size:10px; }
    .preference-choice svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-linecap:round; stroke-linejoin:round; stroke-width:1.65; }
    .preference-choice:hover, .preference-choice[aria-pressed="true"] { border-color:var(--accent); background:var(--surface-selected); color:var(--accent); }
    .density-preview { display:inline-grid; gap:2px; width:13px; }
    .density-preview i { display:block; height:3px; border-radius:2px; background:currentColor; }
    .density-preview.comfortable { gap:4px; }
    .color-preview { display:flex; gap:2px; }
    .color-preview i { display:block; width:7px; height:7px; border-radius:50%; }
    html[data-density="compact"] .currency-list-container { gap:5px; }
    html[data-density="compact"] .currency-card { height:36px; }
    html[data-density="compact"] .flag-icon { width:22px; height:22px; margin-right:8px; }
    html[data-density="compact"] .currency-code { font-size:14px; }
    html[data-density="compact"] .currency-name { font-size:9px; }
    html[data-density="compact"] .amount-input { font-size:15px; }
    html[data-density="comfortable"] .currency-list-container { gap:8px; }
    html[data-density="comfortable"] .currency-card { height:48px; }
    html[data-density="comfortable"] .flag-icon { width:28px; height:28px; margin-right:12px; }
    html[data-density="comfortable"] .currency-code { font-size:17px; }
    html[data-density="comfortable"] .currency-name { font-size:11px; }
    html[data-density="comfortable"] .amount-input { font-size:18px; }
    .source-option { display:flex; width:100%; align-items:center; gap:9px; padding:9px 10px; border:0; border-radius:6px; background:transparent; color:var(--primary); cursor:pointer; font-size:11px; text-align:left; }
    .source-option:hover, .source-option[aria-current="true"] { background:var(--surface-selected); color:var(--accent); }
    .source-option svg { flex:0 0 auto; width:16px; height:16px; fill:none; stroke:currentColor; stroke-linecap:round; stroke-linejoin:round; stroke-width:1.8; }
    .terminal-body { flex:1; }
    .app-footer { margin-top:auto; padding:10px 16px 12px; border-top:1px solid var(--border); background:var(--surface); text-align:center; }
    .update-time { min-height:16px; color:var(--text-muted); font-size:11px; line-height:1.45; }
    .update-time.error { color:var(--error); } .update-time.cached { color:var(--warn); }
    .reference-note { margin-top:3px; color:var(--text-muted); font-size:10px; line-height:1.45; }
    .btn { min-height:34px; padding:8px 12px; border:1px solid var(--primary); border-radius:4px; background:transparent; color:var(--primary); cursor:pointer; font-size:11px; font-weight:600; }
    .btn:hover:not(:disabled) { background:#f6f8fa; } .btn:disabled { opacity:.5; cursor:wait; }
    .btn.editing { border-color:var(--error); background:var(--error); color:#fff; }
    .currency-list-container { position:relative; display:flex; flex-direction:column; gap:6px; padding:0 12px 12px; }
    .currency-card { position:relative; display:flex; align-items:center; width:100%; height:40px; padding:0 12px; overflow:hidden; border:1px solid rgba(0,0,0,.08); border-radius:8px; transition:box-shadow .2s, transform .2s; user-select:none; -webkit-user-select:none; }
    .currency-card.dragging { z-index:50; opacity:.88; box-shadow:0 8px 20px rgba(0,0,0,.25); }
    .currency-card.editing { padding-left:108px; }
    .card-actions-left { position:absolute; left:8px; z-index:10; display:none; align-items:center; gap:5px; }
    .currency-card.editing .card-actions-left { display:flex; }
    .drag-handle { padding:4px; color:rgba(0,0,0,.58); cursor:grab; font-size:18px; line-height:1; touch-action:none; }
    .drag-handle:active { cursor:grabbing; }
    .delete-btn { display:flex; align-items:center; justify-content:center; width:20px; height:20px; border:0; border-radius:50%; background:var(--error); color:#fff; cursor:pointer; font-size:13px; font-weight:700; touch-action:none; }
    .pin-btn { display:grid; width:22px; height:22px; place-items:center; padding:0; border:1px solid rgba(0,0,0,.26); border-radius:50%; background:rgba(255,255,255,.35); color:rgba(0,0,0,.68); cursor:pointer; }
    .pin-btn svg { width:13px; height:13px; fill:transparent; stroke:currentColor; stroke-linecap:round; stroke-linejoin:round; stroke-width:1.8; }
    .pin-btn.pinned { border-color:#8a6700; background:#fff7c2; color:#8a6700; }
    .pin-btn.pinned svg { fill:#ffcc00; }
    .flag-icon { flex:0 0 auto; width:24px; height:24px; margin-right:10px; overflow:hidden; border:1px solid rgba(0,0,0,.15); border-radius:50%; }
    .flag-icon img { width:100%; height:100%; object-fit:cover; }
    .currency-info { display:flex; flex:1.35; align-items:center; min-width:0; gap:7px; overflow:hidden; }
    .currency-code { flex:0 0 auto; color:#000; font-size:16px; font-weight:700; line-height:1.15; white-space:nowrap; }
    .pin-indicator { flex:0 0 auto; color:#8a6700; font-size:12px; line-height:1; }
    .currency-name { min-width:0; color:rgba(0,0,0,.72); font-size:10px; font-weight:600; line-height:1.15; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .currency-value { display:flex; flex:1.2; align-items:center; padding-left:8px; }
    .amount-input { width:100%; border:0; outline:0; background:transparent; color:#000; cursor:pointer; font-size:17px; font-weight:700; text-align:right; }
    .modal { position:fixed; inset:0; z-index:1000; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.5); }
    .modal.active { display:flex; }
    .modal-content { display:flex; align-items:center; justify-content:center; width:100%; height:100%; }
    .calc-container { width:min(340px,calc(100% - 32px)); padding:24px; border:1px solid var(--border); border-radius:20px; background:#fff; box-shadow:0 10px 40px rgba(0,0,0,.15); }
    .calc-header { display:flex; flex-direction:column; justify-content:flex-end; height:80px; padding:16px; margin-bottom:20px; border:1px solid var(--border); border-radius:12px; background:#f6f6f6; text-align:right; }
    .calc-display { color:var(--warn); font-size:32px; font-weight:700; line-height:1.2; overflow:hidden; text-overflow:ellipsis; }
    .calc-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
    .calc-btn { height:60px; border:0; border-radius:12px; background:#f6f6f6; color:var(--primary); cursor:pointer; font-size:20px; }
    .calc-btn:active { transform:scale(.98); } .calc-btn.op { background:#eef4fc; color:var(--accent); } .calc-btn.done { grid-column:span 2; background:#2ea44f; color:#fff; }
    #add-modal .modal-content { align-items:stretch; background:#fff; }
    #add-modal .terminal-header { width:100%; }
    .currency-options { flex:1; overflow-y:auto; }
    .currency-option { display:flex; align-items:center; padding:12px 16px; border-bottom:1px solid var(--border); cursor:pointer; }
    .currency-option:hover { background:#f6f8fa; } .currency-option img { width:32px; height:32px; margin-right:12px; border:1px solid var(--border); border-radius:50%; }
    html[data-theme="dark"] .icon-btn { border-color:var(--toolbar-btn-border); background:var(--toolbar-btn-bg); color:#173044; }
    html[data-theme="dark"] .icon-btn:hover:not(:disabled), html[data-theme="dark"] .icon-btn[aria-expanded="true"] { border-color:#b9dcf0; background:var(--toolbar-btn-hover); }
    html[data-theme="dark"] .icon-btn.editing, html[data-theme="dark"] .icon-btn.editing:hover:not(:disabled) { border-color:var(--editing-border); background:var(--editing-bg); color:#3a2028; }
    html[data-theme="dark"] .currency-card { box-shadow:inset 0 0 0 1px rgba(0,0,0,.14); }
    html[data-theme="dark"] .currency-code, html[data-theme="dark"] .amount-input { color:#15191d; }
    html[data-theme="dark"] .currency-name { color:rgba(21,25,29,.7); }
    html[data-theme="dark"] .drag-handle { color:rgba(21,25,29,.68); }
    html[data-theme="dark"] .pin-btn { border-color:rgba(21,25,29,.3); background:rgba(255,255,255,.45); color:#25323b; }
    html[data-theme="dark"] .calc-container, html[data-theme="dark"] #add-modal .modal-content, html[data-theme="dark"] .currency-option { background:var(--surface) !important; }
    html[data-theme="dark"] .calc-header, html[data-theme="dark"] .calc-btn { background:var(--surface-hover); }
    html[data-theme="dark"] .calc-btn { color:var(--primary); }
    html[data-theme="dark"] .calc-btn.op { background:var(--surface-selected); color:var(--accent); }
    html[data-theme="dark"] .currency-option { border-color:var(--border); }
    html[data-theme="dark"] .currency-option strong { color:var(--primary) !important; }
    html[data-theme="dark"] .currency-option small, html[data-theme="dark"] #calc-expr { color:var(--text-muted) !important; }
    html[data-theme="dark"] .currency-option:hover, html[data-theme="dark"] .btn:hover:not(:disabled) { background:var(--surface-hover); }
    @media (max-width:440px) { .terminal-header { gap:8px; padding:9px 12px; } .terminal-buttons { gap:5px; } .terminal-btn { width:10px; height:10px; } .terminal-title { font-size:11px; } .header-toolbar { gap:2px; } .icon-btn { width:32px; height:32px; } .preferences-menu { right:-2px; } .currency-card { height:40px; } .currency-name { font-size:9px; } }
  </style>
</head>
<body>
  <main class="terminal-window">
    <header class="terminal-header">
      <div class="terminal-buttons" aria-hidden="true"><span class="terminal-btn btn-red"></span><span class="terminal-btn btn-yellow"></span><span class="terminal-btn btn-green"></span></div>
      <h1 class="terminal-title">FX PRO TERMINAL</h1>
      <nav class="header-toolbar" aria-label="匯率工具列">
        <button class="icon-btn" id="theme-btn" type="button" aria-label="切換至深色模式" aria-pressed="false" title="切換至深色模式"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15.7A7.5 7.5 0 0 1 8.3 4 7.5 7.5 0 1 0 20 15.7z"/></svg></button>
        <button class="icon-btn" id="refresh-btn" type="button" aria-label="重新整理匯率" title="重新整理匯率"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 8.5A8 8 0 1 0 20 14"/><path d="M19.5 4.5v4h-4"/></svg></button>
        <button class="icon-btn" id="edit-btn" type="button" aria-label="編輯貨幣清單" title="編輯貨幣清單"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="12" height="16" rx="2"/><path d="m10 16 7.8-7.8a1.7 1.7 0 0 1 2.4 2.4L12.4 18 9 19z"/></svg></button>
        <button class="icon-btn" id="add-btn" type="button" aria-label="新增貨幣" title="新增貨幣"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v8M8 12h8"/></svg></button>
        <div class="preferences-control">
          <button class="icon-btn" id="preferences-menu-btn" type="button" aria-label="卡片密度與色彩主題設定" aria-controls="preferences-menu" aria-expanded="false" title="卡片密度與色彩主題設定"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><path d="M9.2 5v14M14.8 5v14"/></svg></button>
          <div class="preferences-menu" id="preferences-menu" role="dialog" aria-label="卡片顯示偏好">
            <section class="preferences-section" aria-label="卡片密度"><p class="preferences-label">卡片密度</p><div class="choice-grid"><button class="preference-choice" type="button" data-density="compact" aria-pressed="false"><span class="density-preview" aria-hidden="true"><i></i><i></i><i></i></span>緊湊</button><button class="preference-choice" type="button" data-density="comfortable" aria-pressed="false"><span class="density-preview comfortable" aria-hidden="true"><i></i><i></i><i></i></span>舒適</button></div></section>
            <section class="preferences-section" aria-label="卡片配色主題"><p class="preferences-label">卡片配色</p><div class="choice-grid color-themes"><button class="preference-choice" type="button" data-card-theme="pastel" aria-pressed="false"><span class="color-preview" aria-hidden="true"><i style="background:#f4a9a9"></i><i style="background:#9ee7c1"></i><i style="background:#a8d8ff"></i></span>鮮明</button><button class="preference-choice" type="button" data-card-theme="soft" aria-pressed="false"><span class="color-preview" aria-hidden="true"><i style="background:#e8bfc2"></i><i style="background:#bcdcc6"></i><i style="background:#c4d4e8"></i></span>柔和</button><button class="preference-choice" type="button" data-card-theme="mono" aria-pressed="false"><span class="color-preview" aria-hidden="true"><i style="background:#d9dde2"></i><i style="background:#cbd1d8"></i><i style="background:#bcc3cb"></i></span>極簡</button></div></section>
            <section class="preferences-section"><button class="preference-choice" id="install-btn" type="button" aria-label="安裝應用程式" title="安裝應用程式" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v10"/><path d="m8.5 10.5 3.5 3.5 3.5-3.5"/><path d="M5 20h14"/></svg>安裝應用程式</button></section>
          </div>
        </div>
        <div class="source-control">
          <button class="icon-btn" id="source-menu-btn" type="button" aria-label="選擇匯率來源" aria-controls="source-menu" aria-expanded="false" title="選擇匯率來源"><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6.5" rx="7" ry="3"/><path d="M5 6.5v11c0 1.7 3.1 3 7 3s7-1.3 7-3v-11"/><path d="M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/></svg></button>
          <div class="source-menu" id="source-menu" role="menu" aria-label="匯率來源">
            <button class="source-option" type="button" data-api-type="currencyapi" role="menuitem"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16v10H4z"/><path d="M8 11h.01M12 11h4M8 15h8"/></svg><span>Currency API</span></button>
            <button class="source-option" type="button" data-api-type="openerapi" role="menuitem"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg><span>Open ER API</span></button>
          </div>
        </div>
      </nav>
    </header>
    <section class="terminal-body" aria-label="匯率換算器">
      <div id="currency-list" class="currency-list-container" aria-live="polite"></div>
    </section>
    <footer class="app-footer" aria-label="匯率資料資訊">
      <div class="update-time" id="update-time" role="status" aria-live="polite">正在同步匯率資料…</div>
      <p class="reference-note">匯率僅供參考；實際銀行或換匯商報價可能不同。</p>
    </footer>
  </main>
  <div class="modal" id="calc-modal" role="dialog" aria-modal="true" aria-labelledby="calc-title">
    <div class="modal-content"><div class="calc-container">
      <div id="calc-title" style="color:var(--primary);margin-bottom:10px;font-size:12px"></div>
      <div class="calc-header"><div id="calc-expr" style="color:#777;font-size:14px;min-height:1.2em"></div><div class="calc-display" id="calc-display">0</div></div>
      <div class="calc-grid">
        <button class="calc-btn" type="button" style="color:var(--error)" onclick="calcAction('AC')">AC</button><button class="calc-btn" type="button" style="color:var(--error)" onclick="calcAction('DEL')">⌫</button><button class="calc-btn op" type="button" onclick="calcInput('/')">÷</button><button class="calc-btn op" type="button" onclick="calcInput('*')">×</button>
        <button class="calc-btn" type="button" onclick="calcInput('7')">7</button><button class="calc-btn" type="button" onclick="calcInput('8')">8</button><button class="calc-btn" type="button" onclick="calcInput('9')">9</button><button class="calc-btn op" type="button" onclick="calcInput('-')">−</button>
        <button class="calc-btn" type="button" onclick="calcInput('4')">4</button><button class="calc-btn" type="button" onclick="calcInput('5')">5</button><button class="calc-btn" type="button" onclick="calcInput('6')">6</button><button class="calc-btn op" type="button" onclick="calcInput('+')">+</button>
        <button class="calc-btn" type="button" onclick="calcInput('1')">1</button><button class="calc-btn" type="button" onclick="calcInput('2')">2</button><button class="calc-btn" type="button" onclick="calcInput('3')">3</button><button class="calc-btn op" type="button" onclick="calcInput('.')">.</button>
        <button class="calc-btn" type="button" onclick="calcInput('0')">0</button><button class="calc-btn" type="button" onclick="calcInput('00')">00</button><button class="calc-btn done" type="button" onclick="calcAction('DONE')">確認</button>
      </div>
      <button class="btn" type="button" style="width:100%;margin-top:20px;padding:15px;border-color:var(--error);color:var(--error)" onclick="closeModal('calc-modal')">取消</button>
    </div></div>
  </div>
  <div class="modal" id="add-modal" role="dialog" aria-modal="true" aria-label="選擇貨幣">
